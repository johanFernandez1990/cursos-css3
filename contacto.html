<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1,maximun-scale=1">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/scroll.css">
  <link rel="stylesheet" href="assets/fonts/fontawesome-free-6.1.2-web/css/all.min.css">
  <link rel="stylesheet" href="assets/fonts/poppins/poppins.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/loader.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  
  <script src="assets/js/menu.js" defer></script>


  <script src="assets/js/map.js" defer></script>

  <title>Portafolio-Victor Robles</title>
</head>

<body>
  <!-- //layout principal -->
  <div class="layout">
    <!-- barra lateral(info del usuario) -->
    <aside class="layout__aside">
      <section class="aside__userinfo">

        <!-- informacion general usuario -->
        <div class="userinfo__general">
          <div class="userinfo__container-image">
            <img src="assets/img/default-user.jpg" class="userinfo__image" alt="foto del perfil del usuario">
          </div>
          <h2 class="userinfo__name">Johan fernandez</h2>
          <h4 class="userinfo__job">Desarrolador Web</h4>
        </div>

        <!-- menu de navegacion -->
        <nav class="layout__menu">
          <ul class="menu__list">
            <li class="menu__option">
              <a href="index.html" class="menu__Link">
                <i class="fa-solid fa-house menu__icon"></i>
                <span class="menu__overlay">Home</span>
              </a>
            </li>
            <li class="menu__option">
              <a href="sobre-mi.html" class="menu__Link">
                <i class="fa-solid fa-user menu__icon"></i>
                <span class="menu__overlay">Sobre mi</span>
              </a>
            </li>
            <li class="menu__option">
              <a href="curriculun.html" class="menu__Link">
                <i class="fa-solid fa-graduation-cap menu__icon"></i>
                <span class="menu__overlay">Curriculun</span>
              </a>
            </li>
            <li class="menu__option">
              <a href="portafolio.html" class="menu__Link">
                <i class="fa-solid fa-briefcase menu__icon"></i>
                <span class="menu__overlay">Portafolio</span>
              </a>
            </li>
            <li class="menu__option">
              <a href="blog.html" class="menu__Link">
                <i class="fa-solid fa-book menu__icon"></i>
                <span class="menu__overlay">Block</span>
              </a>
            </li>
            <li class="menu__option">
              <a href="contacto.html" class="menu__Link">
                <i class="fa-solid fa-envelope menu__icon"></i>
                <span class="menu__overlay">Contacto</span>
              </a>
            </li>
          </ul>
        </nav>

        <!-- links a redes sociales -->
        <div class="userinfo__links">
          <ul class="links__social">
            <li class="social__option">
              <a href="#" class="social__link">
                <i class="fa-brands fa-youtube" class="social__icon"></i>
              </a>
            </li>
            <li class="social__option">
              <a href="#" class="social__link">
                <i class="fa-brands fa-linkedin" class="social__icon"></i>
              </a>
            </li>
            <li class="social__option">
              <a href="#" class="social__link">
                <i class="fa-brands fa-instagram" class="social__icon"></i>
              </a>
            </li>

          </ul>
        </div>

        <!-- boton -->
        <div class="userinfo__buttons">
          <a href="#" class="userinfo__btn">Descargar Cv</a>

        </div>

        <!-- pie de pagina  -->
        <footer class="userinfo__footer">
          &copy;2024 Johan Fernandez Web
        </footer>

      </section>
    </aside>
     <!-- MENU REESPONSIVE -->
    <div class="layout__menu-toggle">
      <i class="menu-toggle__icon fa-solid fa-bars"></i>
      <i class="menu-toggle__icon fa-solid fa-xmark"></i>
    </div>
    <!-- Contenido principal -->
    <main class="layout__content">
      
        <section class="content__page content__contact">
        <!-- Este contenido cambia con cada pagina Web -->
        
        <header class="contact__header">
          <h1 class="contact__title">Contacto</h1>
        </header>

        <div class="contact__container">
            <section class="contact__info">
                <div class="contact__data">
                    <i class="contact__icon fa-solid fa-location-dot"></i>
                    <h2 class="contact__subtitle">Madrid</h2>
                </div>

                <div class="contact__data">
                    <i class="contact__icon fa-solid fa-phone"></i>
                    <h2 class="contact__subtitle">666-777-888</h2>
                </div>

                <div class="contact__data">
                    <i class="contact__icon fa-solid fa-envelope"></i>
                    <h2 class="contact__subtitle">mf1799278@gmail.com</h2>
                </div>

                <div class="contact__data">
                    <i class="contact__icon fa-solid fa-circle-check"></i>
                    <h2 class="contact__subtitle">Desarrollador Freelancer</h2>
                </div>
            </section>

            <section class="contact__form-box">
                <div class="contact__map" id="load-iframe-map">
                  <span class="loader"></span>
                </div>

                <header class="contact__form-header">
                    <h3 class="form-header__title">Cómo puedo <span class="subtitle__color">Ayudarte?</span></h3>
                </header>

                <form class="contact__form">
                    <div class="form__container">
                        <section class="form__left">
                            <div class="form__group">
                                <input type="text" class="form__input" name="name" required placeholder="Nombre" >
                                <label for="name" class="form__label">Nombre</label>
                            </div>

                            <div class="form__group">
                                <input type="email" class="form__input" name="Email" required placeholder="Email" >
                                <label for="email" class="form__label">Email</label>
                            </div>

                            <div class="form__group">
                                <input type="text" class="form__input" name="subject" required placeholder="Subject" >
                                <label for="subject" class="form__label">Asunto</label>
                            </div>

                        </section>
                        
                        <section class="form__right">
                            <div class="form__group form__group--textarea">
                                <textarea class="form__input form__input--textarea" name="Mensaje" required placeholder="Mensaje"></textarea>
                                <label for="Mensaje" class="form__label">Mensaje</label>
                            </div>
                        </section>
                    </div>
                    <input type="submit" class="form__buttom" value="Enviar Mensaje">

                </form>
            </section>
        </div>
        

        
    </section>
  </main>
</div>
</body>

</html>
